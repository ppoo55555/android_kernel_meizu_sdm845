# .github/workflows/build-kernel.yml
name: meizu_sdm845   # 只是显示名称，可自行改

on:
  push:
    branches: [ lineage-21 ]     # 触发分支
  pull_request:
    branches: [ lineage-21 ]
  workflow_dispatch:
    inputs:
      KERNEL_SUFFIX:
        description: "本地版本后缀（可中文 / emoji）"
        default: "-酷安FutabaWa"
      KERNEL_TIME:
        description: "自定义构建日期"
        default: "Tue Dec 17 23:36:49 UTC 2024"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      # ---------- ccache ----------
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G

    steps:
    #####################################################################
    # 0 · 释放磁盘空间（可选）
    #####################################################################
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet:  true
        remove-android: true
        remove-haskell: true
        remove-codeql:  true

    #####################################################################
    # 1 · 准备环境
    #####################################################################
    - uses: actions/checkout@v4   # 仅 checkout 当前 CI 仓库

    - name: Configure git
      run: |
        git config --global user.name  "Futaba"
        git config --global user.email "3199167602@qq.com"

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          clang-17 lld-17 llvm-17-dev gcc-aarch64-linux-gnu \
          bc bison flex libssl-dev libelf-dev dwarves \
          build-essential cpio python3 ccache

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: /home/runner/.ccache
        key:  ccache-${{ runner.os }}-${{ github.ref }}
        restore-keys: |
          ccache-${{ runner.os }}-

    #####################################################################
    # 2 · 克隆你的内核源码
    #####################################################################
    - name: Clone kernel source
      run: |
        mkdir -p kernel_workspace
        git clone --depth=1 https://github.com/ppoo55555/android_kernel_meizu_sdm845 \
                  kernel_workspace/kernel

    #####################################################################
    # 3 · 生成 defconfig + 可选后缀
    #####################################################################
    - name: Prepare defconfig
      run: |
        cd kernel_workspace/kernel
        # 生成官方 defconfig（请确认文件名）
        make O=out LLVM=1 LLVM_IAS=1 vendor/mz845_defconfig
        # 关闭自动版本号，追加自定义后缀
        sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' out/.config
        echo 'CONFIG_LOCALVERSION="${{ github.event.inputs.KERNEL_SUFFIX }}"' >> out/.config

    #####################################################################
    # 4 · 编译
    #####################################################################
    - name: Build kernel
      run: |
        export KBUILD_BUILD_TIMESTAMP="${{ github.event.inputs.KERNEL_TIME }}"
        export PATH="/usr/lib/ccache:$PATH"
        cd kernel_workspace/kernel
        make -j$(nproc) O=out \
             LLVM=1 LLVM_IAS=1 \
             ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
             all

    #####################################################################
    # 5 · 打包产物
    #####################################################################
    - name: Package Image.gz-dtb
      run: |
        mkdir -p dist
        cp kernel_workspace/kernel/out/arch/arm64/boot/Image.gz-dtb dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image_${{ github.sha }}
        path: dist/Image.gz-dtb
