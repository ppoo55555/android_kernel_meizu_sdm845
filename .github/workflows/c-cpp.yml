# .github/workflows/build-kernel.yml
name: meizu_sdm845

on:
  push:          { branches: [ lineage-21 ] }
  pull_request:  { branches: [ lineage-21 ] }
  workflow_dispatch:
    inputs:
      KERNEL_SUFFIX:
        description: "本地版本后缀（可中文 / emoji）"
        default: "-酷安FutabaWa"
      KERNEL_TIME:
        description: "自定义构建日期"
        default: "Tue Dec 17 23:36:49 UTC 2024"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      # ---------- ccache ----------
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    #####################################################################
    # 0 · 释放磁盘
    #####################################################################
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet:  true
        remove-android: true
        remove-haskell: true
        remove-codeql:  true

    #####################################################################
    # 1 · 基础环境
    #####################################################################
    - uses: actions/checkout@v4

    - name: Configure git
      run: |
        git config --global user.name  Futaba
        git config --global user.email 3199167602@qq.com

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          clang-17 lld-17 llvm-17-dev llvm-17-tools \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi  binutils-arm-linux-gnueabi \
          bc bison flex libssl-dev libelf-dev dwarves \
          build-essential cpio python3 ccache

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: /home/runner/.ccache
        key:  ccache-${{ runner.os }}-${{ github.ref }}
        restore-keys: |
          ccache-${{ runner.os }}-

    #####################################################################
    # 2 · 克隆内核源码
    #####################################################################
    - name: Clone kernel source
      run: |
        mkdir -p kernel_workspace
        git clone --depth=1 https://github.com/ppoo55555/android_kernel_meizu_sdm845 \
                  kernel_workspace/kernel

    #####################################################################
    # 3 · 生成 defconfig（禁用 compat-vDSO）
    #####################################################################
    - name: Prepare defconfig
      run: |
        cd kernel_workspace/kernel
        # ① 生成默认配置
        make O=out LLVM=1 LLVM_IAS=1 mz845_defconfig
        # ② 关闭自动本地版本号，追加后缀
        sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' out/.config
        echo 'CONFIG_LOCALVERSION="${{ github.event.inputs.KERNEL_SUFFIX }}"' >> out/.config
        # ③ 禁用 32-bit compat vDSO，避免 /usr/bin/as -EL 错误
        echo 'CONFIG_COMPAT_VDSO=n' >> out/.config
        yes "" | make O=out olddefconfig

    #####################################################################
    # 4 · 编译（纯 LLVM）
    #####################################################################
    - name: Build kernel
      run: |
        export KBUILD_BUILD_TIMESTAMP="${{ github.event.inputs.KERNEL_TIME }}"
        export PATH="/usr/lib/llvm-17/bin:/usr/lib/ccache:$PATH"
        # 仍保留 32-bit 交叉链，若日后想启用 compat-vDSO 可直接打开
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        cd kernel_workspace/kernel
        make -j$(nproc) O=out \
             ARCH=arm64 \
             CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
             OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             CROSS_COMPILE=aarch64-linux-gnu- \
             LLVM=1 LLVM_IAS=1 \
             all

    #####################################################################
    # 5 · 打包产物：Image-dtb（未压缩）
    #####################################################################
    - name: Package Image-dtb
      run: |
        mkdir -p dist
        # 确保内核 Image 存在
        cp kernel_workspace/kernel/out/arch/arm64/boot/Image dist/Image
        # 合并 Image + 所有 DTB（你也可以只拼接一个 DTB）
        cat dist/Image kernel_workspace/kernel/out/arch/arm64/boot/dts/qcom/*.dtb > dist/Image-dtb
        rm dist/Image

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image_${{ github.sha }}
        path: dist/Image-dtb
