name: mz

on:
  push:
    branches: [ lineage-21 ]
  pull_request:
    branches: [ lineage-21 ]
  workflow_dispatch:
    inputs:
      KERNEL_SUFFIX:
        description: "内核名称后缀（可用中文 / emoji）"
        required: true
        default: "-酷安FutabaWa"
      KERNEL_TIME:
        description: "内核构建日期（默认保留原厂日期）"
        required: true
        default: "Tue Dec 17 23:36:49 UTC 2024"
      enable_feature_x:
        description: "是否启用 KPM"
        required: false
        default: false
        type: boolean
      enable_feature_y:
        description: "是否启用 LZ4KD"
        required: false
        default: false
        type: boolean
      enable_feature_z:
        description: "是否集成 sched_ext"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG_PATH: kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig
      # ---------- ccache ----------
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G

    steps:
    ##########################################################################
    # 0 · 释放磁盘
    ##########################################################################
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet:  true
        remove-android: true
        remove-haskell: true
        remove-codeql:  true

    ##########################################################################
    # 1 · 基础环境
    ##########################################################################
    - uses: actions/checkout@v4

    - name: Configure git
      run: |
        git config --global user.name  "Futaba"
        git config --global user.email "3199167602@qq.com"

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y python3 git curl ccache \
          bc bison flex libssl-dev libelf-dev dwarves \
          build-essential cpio

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: /home/runner/.ccache
        key:  ccache-${{ runner.os }}-${{ github.ref }}
        restore-keys: |
          ccache-${{ runner.os }}-

    ##########################################################################
    # 2 · 同步代码
    ##########################################################################
    - name: Install repo tool
      run: |
        curl -Lo ~/repo https://storage.googleapis.com/git-repo-downloads/repo
        chmod +x ~/repo
        sudo mv ~/repo /usr/local/bin/repo

    - name: Initialize repo and sync
      run: |
        mkdir -p kernel_workspace && cd kernel_workspace
        repo init -u https://github.com/HanKuCha/kernel_manifest.git \
                  -b refs/heads/oneplus/sm8750 \
                  -m JiuGeFaCai_oneplus_13_v.xml --depth=1
        repo sync -c -j$(nproc) --no-tags
        rm kernel_platform/common/android/abi_gki_protected_exports_* || true
        rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

    ##########################################################################
    # 3 · 自定义补丁
    ##########################################################################
    - name: Apply HMBird GKI patch
      run: |
        cd kernel_workspace/kernel_platform/common/drivers
        cat > hmbird_patch.c << 'EOF'
        #include <linux/init.h>
        #include <linux/module.h>
        #include <linux/of.h>
        #include <linux/slab.h>
        #include <linux/string.h>
        static int __init hmbird_patch_init(void)
        {
            struct device_node *np = of_find_node_by_path("/soc/oplus,hmbird/version_type");
            const char *type;
            if (!np || of_property_read_string(np, "type", &type))
                return 0;
            if (!strcmp(type, "HMBIRD_OGKI")) {
                struct property *prop = of_find_property(np, "type", NULL);
                struct property *newp = kzalloc(sizeof(*prop), GFP_KERNEL);
                if (!prop || !newp)
                    return 0;
                memcpy(newp, prop, sizeof(*prop));
                newp->value   = kstrdup("HMBIRD_GKI", GFP_KERNEL);
                newp->length  = strlen("HMBIRD_GKI") + 1;
                of_remove_property(np, prop);
                of_add_property(np, newp);
                pr_info("hmbird_patch: converted OGKI -> GKI\n");
            }
            of_node_put(np);
            return 0;
        }
        early_initcall(hmbird_patch_init);
        MODULE_LICENSE("GPL");
        MODULE_DESCRIPTION("Force HMBIRD_GKI version");
        EOF
        grep -q "hmbird_patch.o" Makefile || echo "obj-y += hmbird_patch.o" >> Makefile
        cd ../../../
        git add -A && git commit -m "Add HMBird GKI patch" || true

    - name: Apply LZ4KD patches
      if: ${{ inputs.enable_feature_y }}
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git
        cp SukiSU_patch/other/zram/zram_patch/6.6/lz4kd.patch kernel_platform/common/
        cd kernel_platform/common
        patch -p1 -F3 < lz4kd.patch || true

    - name: Add sched_ext
      if: ${{ inputs.enable_feature_z }}
      run: |
        cd kernel_workspace/kernel_platform
        git clone --depth=1 https://github.com/HanKuCha/sched_ext.git
        cp -r sched_ext/* common/kernel/sched
        rm -rf sched_ext .git

    ##########################################################################
    # 4 · 修改 defconfig
    ##########################################################################
    - name: Update kernel config & metadata
      run: |
        DEF=$DEFCONFIG_PATH
        # 通用
        cat >> $DEF <<'CFG'
        CONFIG_LOCALVERSION_AUTO=n
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_TCP_CONG="bbr"
        CONFIG_CRYPTO_LZ4HC=y
        CONFIG_CRYPTO_LZ4K=y
        CONFIG_CRYPTO_LZ4KD=y
        CONFIG_CRYPTO_842=y
        CFG
        # 条件
        [[ "${{ inputs.enable_feature_x }}" == "true" ]] && echo 'CONFIG_KPM=y' >> $DEF
        # 后缀
        sed -i 's/-4k/${{ github.event.inputs.KERNEL_SUFFIX }}/' $DEF
        # 跳过 GKI 校验
        sed -i 's/check_defconfig//' kernel_workspace/kernel_platform/common/build.config.gki

    ##########################################################################
    # 5 · 编译
    ##########################################################################
    - name: Build kernel (LLVM toolchain)
      run: |
        export KBUILD_BUILD_TIMESTAMP="${{ github.event.inputs.KERNEL_TIME }}"
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
        export PATH="/usr/lib/ccache:$PATH"
        sudo apt-get install -y libelf-dev
        cd kernel_workspace/kernel_platform/common
        make -j$(nproc) LLVM=1 LLVM_IAS=1 \
             ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
             O=out gki_defconfig all

    ##########################################################################
    # 6 · 打包产物
    ##########################################################################
    - name: Package artifacts
      run: |
        mkdir -p dist
        cp kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image.gz-dtb dist/

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image_${{ github.sha }}
        path: dist/Image.gz-dtb
